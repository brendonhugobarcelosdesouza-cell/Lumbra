name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    # o engine Python vive em core/; passos `run:` executam lá. O gitleaks
    # (uses:) não é afetado por isto e varre o repositório inteiro.
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
        # histórico completo: o gitleaks escaneia o INTERVALO de commits do
        # push; com clone raso (depth 1) os commits intermediários faltam e
        # o scan quebra com "stderr is not empty". fetch-depth: 0 é requisito
        # documentado do gitleaks-action.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Unit + API tests (feedback rápido, sem infra)
        run: pytest -m "not integration"

  windows:
    # Portabilidade: caminhos, fins de linha e encoding só quebram no Windows
    # (ex.: file:// URI -> caminho nativo no blob store). Roda unit + API, que
    # é onde essa classe de bug aparece. Os testes de Redis pulam (services do
    # GitHub Actions só sobem em runner Linux); a integração completa no
    # Windows é validada localmente com `pytest`.
    runs-on: windows-latest
    needs: quality
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Unit + API tests (Windows)
        run: pytest -m "not integration"

  integration:
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: core
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      # Portão de cobertura vive AQUI: só neste job a suíte inteira roda com
      # infra real (Redis do `services` + Postgres embutido via pgserver), então
      # é o único lugar onde a cobertura reflete o sistema todo — adapters,
      # rotas da API e fluxos e2e inclusos. Rodar unit + integração juntos.
      - name: Suíte completa + cobertura (piso 80%)
        run: pytest --cov --cov-report=term-missing

  dart-client:
    # O cliente Dart não é commitado: é GERADO do contrato e validado aqui.
    # Este job prova que a projeção OpenAPI → Dart compila — a máquina do CI,
    # com o SDK Dart, é quem valida (o contrato é a única fonte, docs/24).
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - name: Gerar o cliente Dart do contrato
        run: bash packages/lumbra_api_dart/generate.sh
      - name: Instalar deps e compilar (dart analyze)
        working-directory: packages/lumbra_api_dart/generated
        run: |
          dart pub get
          dart analyze --no-fatal-warnings --no-fatal-infos

  flutter-app:
    # O cliente desktop Flutter (P2). Não há SDK Dart/Flutter no ambiente de
    # desenvolvimento; este job é o gate real: gera o cliente do contrato,
    # resolve deps e compila/testa o app. Um código, todas as plataformas.
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Gerar o cliente Dart (dependência do app)
        run: bash packages/lumbra_api_dart/generate.sh
      - name: Analisar e testar o app
        working-directory: clients/app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile.api -t lumbra-api:ci .
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 lumbra-api:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
