[alembic]
script_location = src/lumbra/adapters/persistence/migrations
prepend_sys_path = src
# DSN vem de LUMBRA_DATABASE__DSN (env.py); nunca hardcode aqui

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
