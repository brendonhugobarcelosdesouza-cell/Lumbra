[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumbra"
version = "0.1.0"
description = "Lumbra — Personal Intelligence Platform (Core Intelligence Engine)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Brendon", email = "brendonhugobarcelosdesouza@gmail.com" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "pyjwt>=2.8",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.2.5",
    "pypdf>=4.2",
    "pdfplumber>=0.11",  # fallback de extração para PDF de layout complexo (issue #6)
    "python-docx>=1.1",
    "fastembed>=0.7",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",  # Ed25519: identidade por par de chaves (ADR-045)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    # versões FIXAS (não >=): ruff e mypy mudam regras e formatação entre
    # releases, e um patch a mais no CI que no local vira "passa aqui, falha
    # lá". Fixar garante que o gate seja idêntico em toda máquina.
    "ruff==0.16.0",
    "mypy==2.3.0",
    "pgserver>=0.1.4",
]

[project.scripts]
lumbra = "lumbra.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lumbra"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # datetimes ingênuos proibidos
    "T20",       # print proibido (usar logging)
    "SIM",       # simplify
    "PTH",       # pathlib
    "RUF",
    "S",         # bandit (segurança)
    "ANN",       # anotações de tipo obrigatórias
]
ignore = [
    "ANN401",    # Any explícito é permitido onde justificado
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI: Depends()/Query() como valor default é o padrão idiomático e,
# com `from __future__ import annotations`, é a única forma de referenciar
# uma dependência que é variável de closure (o Annotated stringizado não a
# resolve). Não é o "mutable default arg" que o B008 mira.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "S105", "S106"]  # assert e senhas fictícias em testes
# medição de performance imprime números para comparação humana (roda com -s)
"tests/integration/test_perf_baseline.py" = ["T201"]
"tests/integration/test_eventbus_load.py" = ["T201"]  # baseline imprime numeros
"src/lumbra/api/console_ui.py" = ["E501"]  # HTML/JS inline do Developer Console
"src/lumbra/api/system.py" = ["E501"]  # HTML/JS inline da página System Health
# numa CLI, stdout É a interface: print é a saída correta, não um resquício
# de depuração. S603/S607 idem: os subprocessos são fixos (docker/alembic).
"src/lumbra/cli/*" = ["T201", "S603", "S607"]
# scripts de diagnóstico de linha de comando: print é a saída pretendida.
"scripts/*.py" = ["T201"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
mypy_path = "src"
packages = ["lumbra"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: exige serviços externos (PG/Redis via docker)",
]

[tool.coverage.run]
source = ["src/lumbra"]
branch = true
omit = [
    "*/adapters/persistence/migrations/*",  # migrações Alembic: geradas, versionadas, não são lógica testável
]

# Portão medido sobre a SUÍTE INTEIRA (unit + integração), no job `integration`
# — é onde adapters Postgres/Redis, rotas da API e fluxos e2e realmente rodam.
# Medir só o job unitário dava ~66% (metade do sistema não executa ali) e
# reprovava o gate por engano. Este é um PISO com catraca: sobe conforme a
# cobertura real crescer; nunca desce.
[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
